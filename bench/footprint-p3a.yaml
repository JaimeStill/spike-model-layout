# Footprint cell P3a: gemma-4-E4B's audio through chat, 1 stream sending 1 request: the longest
# clip of the audio cells' data, hf-internal-testing/librispeech_asr_dummy's row 4
# (1272-128104-0004, 29.4 s, within the card's 30-second audio limit), with the model card's
# transcription prompt; the reply ends when the model stops, at most 256 tokens. The peak the
# longest clip adds over the loaded model. P3 is two scenarios, P3a and P3b, because GuideLLM
# reads its sources side by side, one row of each a request, so every request of one scenario
# has the same shape. Adapted from spike-model-engines' bench/audio-b.yaml, at 1 stream and the
# one clip. It needs GuideLLM's audio extra, which mise.bench.toml installs. Engine-neutral: the
# section and its tokenizer (google/gemma-4-E4B-it) are given on the command line, as `cell`'s
# <section> <tokenizer>, the JSON's path by `cell`, and the target in
# GUIDELLM__SPEC__BACKEND__TARGET. Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # A transcript is as long as its clip, so the request sets no output tokens or ignore_eos;
    # this caps the reply, sent as max_completion_tokens, should the model not stop.
    max_tokens: 256
  profile:
    kind: concurrent
    streams: 1
  # The two sources are read side by side, one row of each the request. Source 0 is the prompt,
  # from Gemma 4's card. Source 1 is the dataset's clean validation split cut to its row 4, the
  # 29.4 s clip, by the split's slice; audio-b reads the same split from its start, so this is the
  # longest clip its cells send.
  data:
    - kind: in_memory_dict
      data:
        prompt:
          - "Transcribe the following speech segment in English into English text. Only output the transcription, with no newlines."
    - kind: huggingface
      source: hf-internal-testing/librispeech_asr_dummy
      load_kwargs:
        name: clean
        split: validation[4:5]
  # Only the prompt and the clip: LibriSpeech's own text column is the reference transcript, which
  # the mapper's defaults would otherwise send as the prompt.
  data_column_mapper:
    kind: generative_column_mapper
    column_mappings:
      text_column: 0.prompt
      audio_column: 1.audio
  # The clip re-encoded as 16 kHz mono WAV, which llama.cpp's input_audio accepts; the source is
  # FLAC, which it doesn't.
  data_preprocessors:
    - kind: encode_media
      audio_kwargs:
        audio_format: wav
        encode_sample_rate: 16000
  constraints:
    - kind: max_requests
      count: 1
