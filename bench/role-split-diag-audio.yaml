# Role-split diagnostic D1/D2: the split's single-stream audio slowdown (S-audio level 1, RTFx
# median 6.12, against F-audio level 1, 11.11), tested for slot count alone. One E4B section loaded
# alone on gb10-2 after a fresh load and a cache drop: D1 set A's 4-slot
# ggml-org/gemma-4-E4B-it-GGUF:Q8_0, D2 the 16-slot gemma-4-E4B-it-Q8_0-16-slots. One concurrent
# stream for 60 s, no ramp-up. Each request is F-audio's and S-audio's
# (role-split-audio-full.yaml, -audio-split.yaml): one LibriSpeech clip with the model card's
# transcription prompt, the reply at most 256 tokens. It needs GuideLLM's audio extra, which
# mise.bench.toml installs. The stream count and duration are in the file, since `cell` takes
# neither on its command line: `cell <name> role-split-diag-audio <section> google/gemma-4-E4B-it`.
# Engine-neutral: the section and its tokenizer are given on the command line, the JSON's path by
# `cell`, and the target in GUIDELLM__SPEC__BACKEND__TARGET. Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # A transcript is as long as its clip, so no request sets output tokens or ignore_eos; this
    # caps each reply, sent as max_completion_tokens, should the model not stop.
    max_tokens: 256
  profile:
    kind: concurrent
    streams: 1
    rampup_duration: 0
  # The two sources are read side by side, one row of each a request, and the run stops when
  # either runs out. GuideLLM doesn't cycle a source, and F-audio's 1 stream sent 49 requests in
  # 30 s, so the 73 clips would run out at about 45 s: source 1 reads the clean validation split
  # twice, 146 rows, by the split's `+`, in the knee files' order (clip 1 first), and source 0
  # holds the card's prompt 146 times, one a row, room for 2.4 requests a second over 60 s.
  data:
    - kind: in_memory_dict
      data:
        prompt:
          [
            &prompt "Transcribe the following speech segment in English into English text. Only output the transcription, with no newlines.",
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt, *prompt,
            *prompt
          ]
    - kind: huggingface
      source: hf-internal-testing/librispeech_asr_dummy
      load_kwargs:
        name: clean
        split: validation+validation
  # Only the prompt and the clip: LibriSpeech's own text column is the reference transcript, which
  # the mapper's defaults would otherwise send as the prompt.
  data_column_mapper:
    kind: generative_column_mapper
    column_mappings:
      text_column: 0.prompt
      audio_column: 1.audio
  # Every clip re-encoded as 16 kHz mono WAV, which llama.cpp's input_audio accepts; the source is
  # FLAC, which it doesn't.
  data_preprocessors:
    - kind: encode_media
      audio_kwargs:
        audio_format: wav
        encode_sample_rate: 16000
  constraints:
    - kind: max_duration
      seconds: 60
