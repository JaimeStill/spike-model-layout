# Role-split mixed cells F-mixed, S-mixed and S-knee, the embedding process: one of four GuideLLM
# processes started together, one a purpose, each a constant concurrency for 240 s, under the 10
# min cap. Granite-embedding-english-r2's section,
# mrutkows/granite-embedding-english-r2-GGUF:BF16, in both arms (gb10-2). Each request is
# F-embed's (role-split-embed.yaml): 512 synthetic tokens to /v1/embeddings. The scenario sets no
# stream count: each cell gives its own in GUIDELLM__SPEC__PROFILE__STREAMS, which GuideLLM reads
# into the profile's streams when the file leaves them out (a value in the file would win over the
# variable), so one file serves F-mixed and S-mixed at the load target, 16, and S-knee at the
# purpose's split knee: `GUIDELLM__SPEC__PROFILE__STREAMS=16 cell <name> role-split-mixed-embed
# <section> <tokenizer>`. With none set the run refuses to start. Run directly, GuideLLM's
# `--profile kind=concurrent,streams=<n>` sets it the same way. Engine-neutral: the section and
# its tokenizer (ibm-granite/granite-embedding-english-r2) are given on the command line, as
# `cell`'s <section> <tokenizer>, the JSON's path by `cell`, and the target in
# GUIDELLM__SPEC__BACKEND__TARGET. Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
  profile:
    kind: concurrent
  data:
    - kind: synthetic_text
      prompt_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 240
