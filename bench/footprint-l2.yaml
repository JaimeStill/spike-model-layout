# Footprint cell L2: gemma-4-26B-A4B QAT, 4 streams sending 32 requests in all, 8 each back to
# back, each one synthetic 1440p JPEG (2560 x 1440, GuideLLM's default gradient at quality 85,
# different in every request) beside 200 synthetic text tokens, and exactly 64 output tokens: one
# stream per slot of the preset's 4, the peak the section's slots reach under images. Copied from
# spike-model-engines' bench/vision-b.yaml, its resolution 720p raised to 1440p. It needs
# GuideLLM's vision extra, which mise.bench.toml installs. Engine-neutral: the section and its
# tokenizer (google/gemma-4-26B-A4B-it) are given on the command line, as `cell`'s <section>
# <tokenizer>, the JSON's path by `cell`, and the target in GUIDELLM__SPEC__BACKEND__TARGET. Run
# from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: 4
  # The two sources are read side by side, one row of each a request: the text, cut to its 200
  # tokens by the tokenizer, and the image, which carries the request's output tokens. GuideLLM
  # sends max_completion_tokens with ignore_eos, so every request generates its full 64.
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 1440p
      format: jpeg
      output_tokens: 64
  constraints:
    - kind: max_requests
      count: 32
