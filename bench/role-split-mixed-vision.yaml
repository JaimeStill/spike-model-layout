# Role-split mixed cells F-mixed, S-mixed and S-knee, the vision process: one of four GuideLLM
# processes started together, one a purpose, each a constant concurrency for 240 s, under the 10
# min cap. The full set's vision is set A's 26B-A4B QAT section,
# google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0; the split's is gb10-2's
# gemma-4-26B-A4B-it-qat-Q4_0-16-slots. Each request is F-vision's (role-split-vision-full.yaml):
# one synthetic 1440p JPEG beside 200 synthetic text tokens, exactly 100 output tokens. It needs
# GuideLLM's vision extra, which mise.bench.toml installs. The scenario sets no stream count: each
# cell gives its own in GUIDELLM__SPEC__PROFILE__STREAMS, which GuideLLM reads into the profile's
# streams when the file leaves them out (a value in the file would win over the variable), so one
# file serves F-mixed and S-mixed at the load target, 4, and S-knee at what it held in the split:
# `GUIDELLM__SPEC__PROFILE__STREAMS=4 cell <name> role-split-mixed-vision <section> <tokenizer>`.
# With none set the run refuses to start. Run directly, GuideLLM's `--profile
# kind=concurrent,streams=<n>` sets it the same way. Engine-neutral: the section and its tokenizer
# (google/gemma-4-26B-A4B-it) are given on the command line, as `cell`'s <section> <tokenizer>,
# the JSON's path by `cell`, and the target in GUIDELLM__SPEC__BACKEND__TARGET. Run from the
# repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 1440p
      format: jpeg
      output_tokens: 100
  constraints:
    - kind: max_duration
      seconds: 240
