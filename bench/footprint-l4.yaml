# Footprint cell L4: granite-embedding-english-r2, 512 synthetic tokens a request to
# /v1/embeddings, at 1 stream and then 16, each level for 30 s: two benchmarks in one run, one
# JSON, the peak the section's 16 slots reach. Copied unchanged but for this header from
# spike-model-engines' bench/embed.yaml. An embedding has no output tokens, streaming, TTFT, or
# ITL, so the figures are request latency and throughput. Engine-neutral: the section and its
# tokenizer (ibm-granite/granite-embedding-english-r2) are given on the command line, as `cell`'s
# <section> <tokenizer>, the JSON's path by `cell`, and the target in
# GUIDELLM__SPEC__BACKEND__TARGET. Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
  profile:
    kind: concurrent
    streams: [1, 16]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 30
